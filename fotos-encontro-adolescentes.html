    <!-- LIGHTBOX GALERIA -->
    <div id="lightbox" class="fixed inset-0 z-[99999] bg-stone-900/95 flex items-center justify-center backdrop-blur-md transition-opacity duration-300 opacity-0 pointer-events-none">
        <button onclick="closeLightbox()" class="absolute top-6 right-6 w-12 h-12 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center text-white transition-colors z-10 cursor-pointer">
            <iconify-icon icon="solar:close-circle-bold" width="32"></iconify-icon>
        </button>
        <button onclick="prevLightbox()" class="absolute left-4 md:left-8 w-12 h-12 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center text-white transition-colors z-10 cursor-pointer">
            <iconify-icon icon="solar:arrow-left-bold" width="28"></iconify-icon>
        </button>
        <button onclick="nextLightbox()" class="absolute right-4 md:right-8 w-12 h-12 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center text-white transition-colors z-10 cursor-pointer">
            <iconify-icon icon="solar:arrow-right-bold" width="28"></iconify-icon>
        </button>
        <img id="lightbox-img" src="" alt="Ampliada" decoding="async" class="max-w-[90vw] max-h-[85vh] object-contain rounded-xl shadow-2xl transition-transform duration-300 scale-95"/>
    </div>

    <script>
        let lbIndex = 0;
        let lbSrcs = [];

        function openLightbox(index) {
            lbIndex = index;
            const img = document.getElementById('lightbox-img');
            const lb = document.getElementById('lightbox');
            img.src = lbSrcs[lbIndex];
            img.classList.remove('scale-95');
            img.classList.add('scale-100');
            lb.classList.remove('opacity-0', 'pointer-events-none');
            lb.classList.add('opacity-100', 'pointer-events-auto');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            const img = document.getElementById('lightbox-img');
            const lb = document.getElementById('lightbox');
            img.classList.remove('scale-100');
            img.classList.add('scale-95');
            lb.classList.remove('opacity-100', 'pointer-events-auto');
            lb.classList.add('opacity-0', 'pointer-events-none');
            document.body.style.overflow = '';
        }

        function prevLightbox() {
            lbIndex = (lbIndex - 1 + lbSrcs.length) % lbSrcs.length;
            document.getElementById('lightbox-img').src = lbSrcs[lbIndex];
        }

        function nextLightbox() {
            lbIndex = (lbIndex + 1) % lbSrcs.length;
            document.getElementById('lightbox-img').src = lbSrcs[lbIndex];
        }

        document.addEventListener('DOMContentLoaded', () => {
            const thumbs = document.querySelectorAll('.gallery-thumb');
            lbSrcs = Array.from(thumbs).map(t => t.getAttribute('data-src'));
            
            thumbs.forEach((thumb, i) => {
                thumb.addEventListener('click', () => openLightbox(i));
            });

            document.getElementById('lightbox').addEventListener('click', (e) => {
                if (e.target.id === 'lightbox') closeLightbox();
            });

            document.addEventListener('keydown', (e) => {
                const lb = document.getElementById('lightbox');
                if (lb && lb.classList.contains('opacity-100')) {
                    if (e.key === 'Escape') closeLightbox();
                    if (e.key === 'ArrowLeft') prevLightbox();
                    if (e.key === 'ArrowRight') nextLightbox();
                }
            });
        });

        (function () {
            if(window.lucide) {
                lucide.createIcons();
            }

            const once = true;
            if (!window.__inViewIO) {
                window.__inViewIO = new IntersectionObserver((entries) => {
                    entries.forEach((entry) => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add("animate");
                            if (once) window.__inViewIO.unobserve(entry.target);
                        }
                    });
                }, { threshold: 0.1, rootMargin: "0px" });
            }

            document.querySelectorAll(".animate-on-scroll").forEach((el) => {
                window.__inViewIO.observe(el); 
            });
        })();
    </script>
